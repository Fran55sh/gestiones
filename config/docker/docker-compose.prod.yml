# Credenciales de Postgres y DATABASE_URL deben definirse en `.env.prod` en la raíz del repo
# (POSTGRES_PASSWORD y DATABASE_URL con la misma contraseña). No usar ${DB_PASSWORD} aquí:
# Compose lo resuelve en el host y suele quedar vacío y romper la app ("no password supplied").

services:
  db:
    image: postgres:15-alpine
    container_name: gestiones-db-prod
    env_file:
      - ../../.env.prod
    environment:
      POSTGRES_DB: gestiones
      POSTGRES_USER: gestiones_user
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gestiones_user -d gestiones"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ../..
      dockerfile: config/docker/Dockerfile.prod
    container_name: gestiones-mvp-prod
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:5000:5000"  # Solo accesible desde localhost (Nginx)
    env_file:
      - ../../.env.prod
    environment:
      - FLASK_ENV=production
      - FLASK_APP=app/wsgi.py
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/healthz')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:

